<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文獻整理・教師監考</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5ef;color:#233d3b;font-family:system-ui,-apple-system,sans-serif}header{padding:25px 5%;background:white;border-bottom:1px solid #dce3d8}a{color:#245846}h1{font-size:26px}main{max-width:1150px;padding:24px;margin:auto}button,input,select{font:inherit;border-radius:8px;padding:11px;border:1px solid #cad7cc;background:white;color:#254b40}button{cursor:pointer}button.primary{background:#245846;color:white}.card{background:white;border:1px solid #dce3d8;border-radius:14px;padding:24px;margin:15px 0}label{display:block;margin:12px 0 7px}p{line-height:1.7;color:#6a7f73}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat{padding:20px;background:white;border-radius:12px;border:1px solid #dce3d8}.stat strong{display:block;font-size:30px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}.toolbar input{flex:1;min-width:170px}table{width:100%;border-collapse:collapse;background:white}th,td{padding:14px;text-align:left;border-bottom:1px solid #e1e7dc;font-size:14px}th{color:#61796b}.table-wrap{overflow:auto;border:1px solid #dce3d8;border-radius:12px}.badge{color:#245846;font-weight:600}.detail{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;font-size:14px}#status{font-size:13px;min-height:20px}progress{accent-color:#245846;width:85px}#login{max-width:490px;margin:40px auto}#login input{width:100%}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #6a9f84;outline-offset:3px}@media(max-width:650px){main{padding:14px}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:24px}}@media print{header, #login,.toolbar,.stats,.table-wrap,#status,#detail button{display:none}body{background:white}main{padding:0}.card{border:0}}
</style><header><a href="/">← 文獻整理入口</a>　<a href="/review.html">學生共同入口</a><h1>文獻整理・教師監考</h1><p style="margin:0">查看學生整理進度、草稿內容與繳交紀錄。</p></header><main><form id="login" class="card"><h2>教師登入</h2><p>使用教師指定的監考密碼。</p><label for="password">教師密碼</label><input id="password" type="password" required autocomplete="current-password"><button class="primary" style="margin-top:18px">登入監考</button></form><p id="status" role="status" aria-live="polite"></p><section id="dashboard" hidden><div class="stats"><div class="stat">整理紀錄<strong id="total">0</strong></div><div class="stat">目前在線<strong id="online">0</strong></div><div class="stat">已繳交<strong id="submitted">0</strong></div></div><div class="toolbar"><input id="search" placeholder="搜尋學號、姓名或文章名稱" aria-label="搜尋學號、姓名或文章名稱"><select id="filter" aria-label="繳交狀態"><option value="all">全部紀錄</option><option value="draft">整理中</option><option value="submitted">已繳交</option></select><button id="refresh">更新</button><button id="export">匯出目前篩選資料</button><button id="logout">登出</button></div><p>每 5 秒更新。進度表示已填寫的項目數；內容品質請由教師審閱。最多顯示最新 1,000 份紀錄。在線表示最近 45 秒內有活動，未登記學生不會出現在清單。</p><div class="table-wrap"><table><thead><tr><th>學生</th><th>文章名稱</th><th>整理進度</th><th>狀態</th><th>最近活動</th><th>內容</th></tr></thead><tbody id="rows"></tbody></table></div><section class="card" id="detail" hidden><h2 id="detailTitle"></h2><div class="toolbar"><button id="print">列印／另存 PDF</button><button id="close">收合內容</button></div><div id="detailText" class="detail"></div></section></section><script>
const el=id=>document.getElementById(id);let key='',reviews=[],selected=null,poll=null,busy=false;
const labels=['文章名稱','作者姓名與年代','研究目的','研究設計','研究對象','研究變項','研究結果','檢視與匯出'];
function generalGroups(d){return [Boolean(d.title?.trim()),Boolean(d.authors?.trim()&&d.year?.trim()),Boolean(d.purpose?.trim()),Boolean(d.design?.trim()),['population','sample','inclusion','exclusion'].every(k=>d[k]?.trim()),d.variables?.length>0&&d.variables.every(x=>['name','tool','reliability','validity'].every(k=>x[k]?.trim())),d.results?.length>0&&d.results.every(x=>['variables','method','findings'].every(k=>x[k]?.trim()))]}
function groups(d){return generalGroups(d)}
function filtered(){const q=el('search').value.trim().toLowerCase();return reviews.filter(r=>(el('filter').value==='all'||r.status===el('filter').value)&&[r.student_id,r.student_name,r.data.title||''].join(' ').toLowerCase().includes(q))}
function time(t){return t?new Date(t).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'—'}
function render(){el('total').textContent=reviews.length;el('online').textContent=reviews.filter(r=>r.online).length;el('submitted').textContent=reviews.filter(r=>r.status==='submitted').length;el('rows').replaceChildren();const list=filtered();list.forEach(r=>{const tr=document.createElement('tr');const count=groups(r.data).filter(Boolean).length;const values=[r.student_id+' '+r.student_name,(r.data.title||'（未填題名）'),count+'/'+7+' 項 · '+labels[r.step],(r.status==='submitted'?'已繳交':'整理中')+' · '+(r.online?'在線':'離線'),time(r.last_seen_at)];values.forEach((v,i)=>{const td=document.createElement('td');td.textContent=v;if(i===3)td.className='badge';tr.append(td)});const td=document.createElement('td'),b=document.createElement('button');b.textContent='查看';b.onclick=()=>{selected=r.id;show(r);el('detail').scrollIntoView({behavior:'smooth'})};td.append(b);tr.append(td);el('rows').append(tr)});if(!list.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=6;td.textContent='目前沒有符合條件的紀錄。';tr.append(td);el('rows').append(tr)}if(selected){const r=reviews.find(x=>x.id===selected);if(r)show(r)}}
function show(r){const d=r.data;const v=x=>x||'（尚未填寫）';el('detail').hidden=false;el('detailTitle').textContent=r.student_id+' '+r.student_name+' · '+(d.title||'文獻整理');el('detailText').textContent=`狀態：${r.status==='submitted'?'已繳交':'整理中'}\n最近儲存：${time(r.updated_at)}\n繳交時間：${time(r.submitted_at)}\n\n一、文章名稱\n${v(d.title)}\n\n二、作者姓名與年代\n作者：${v(d.authors)}\n年代：${v(d.year)}\n\n三、研究目的\n${v(d.purpose)}\n\n四、研究設計\n${v(d.design)}\n\n五、研究對象\n對象特性：${v(d.population)}\n場域：${v(d.setting)}\n個案數：${v(d.sample)}\n收案條件：${v(d.inclusion)}\n排除條件：${v(d.exclusion)}\n\n六、研究變項\n${(d.variables||[]).map((x,i)=>`${i+1}. ${v(x.name)}\n研究工具：${v(x.tool)}\n信度：${v(x.reliability)}\n效度：${v(x.validity)}`).join('\n\n')}\n\n七、研究結果\n${['單變項','雙變項','其他'].map(t=>t+'\n'+((d.results||[]).filter(x=>x.type===t).map((x,i)=>`${i+1}. 變項／關係：${v(x.variables)}\n分析方法：${v(x.method)}\n結果：${v(x.findings)}`).join('\n\n')||'（尚未填寫）')).join('\n\n')}`}
async function load(){if(busy||!key)return;busy=true;const requestKey=key;try{const res=await fetch('/api/literature',{headers:{authorization:'Bearer '+requestKey},cache:'no-store'});const x=await res.json();if(key!==requestKey)return;if(!res.ok){if(res.status===401)logout();throw Error(x.error||'讀取失敗')}reviews=x.reviews;el('login').hidden=true;el('dashboard').hidden=false;el('status').textContent='最後更新：'+time(x.updatedAt);render()}catch(e){el('status').textContent='更新失敗：'+e.message}finally{busy=false}}
function logout(){key='';clearInterval(poll);reviews=[];selected=null;el('detail').hidden=true;el('detailText').textContent='';el('rows').replaceChildren();el('dashboard').hidden=true;el('login').hidden=false;el('password').value='';el('status').textContent='已登出'}
el('login').onsubmit=async e=>{e.preventDefault();key=el('password').value;await load();if(key){clearInterval(poll);poll=setInterval(load,5000)}};el('refresh').onclick=load;el('search').oninput=render;el('filter').onchange=render;el('logout').onclick=logout;el('close').onclick=()=>{selected=null;el('detail').hidden=true};el('print').onclick=()=>window.print();el('export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(filtered(),null,2)],{type:'application/json'}));a.href=url;a.download='學生文獻整理紀錄.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
