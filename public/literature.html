<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>學生文獻整理</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#233d3b;background:#f4f5ef}*{box-sizing:border-box}body{margin:0}header{padding:24px 5%;border-bottom:1px solid #dce2d8;background:#fff}header small{letter-spacing:3px;color:#637b71}h1{font-size:26px;margin:8px 0}p{color:#667c72;line-height:1.7}.layout{display:grid;grid-template-columns:235px 1fr;max-width:1150px;margin:30px auto;gap:32px;padding:0 24px}nav button{display:block;width:100%;text-align:left;margin:7px 0;background:transparent;color:#526b61;border:0;padding:14px;border-radius:10px}button{cursor:pointer;font:inherit;padding:10px 17px;border:1px solid #ccd8cf;border-radius:8px;background:#fff;color:#294f43}button.active,button.primary{background:#245846;color:white;border-color:#245846}main{background:white;padding:30px;border:1px solid #dfe5db;border-radius:16px;min-width:0}h2{margin-top:8px;font-size:24px}label{display:block;margin:19px 0 7px;font-weight:600;font-size:14px}input,textarea,select{font:inherit;width:100%;padding:12px;border:1px solid #cad5ce;border-radius:8px;background:#fdfefa;color:#233d3b}input:focus,textarea:focus,select:focus{outline:2px solid #6c9e87;outline-offset:2px}textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#f7f9f4;border:1px solid #dce5d9;padding:20px;border-radius:12px;margin:18px 0}.card h3{margin:0;display:flex;justify-content:space-between;align-items:center}.card h3 button{font-size:13px}.footer{display:flex;justify-content:space-between;margin-top:30px;padding-top:20px;border-top:1px solid #e4e9df}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}progress{width:100%;accent-color:#245846;height:7px}#status{font-size:12px;margin:15px 0;color:#617b6b}.hint{font-size:13px;color:#6e8075}#preview{white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere} @media(max-width:750px){.layout{display:block;padding:0 14px;margin:16px auto}nav{display:flex;overflow:auto;margin-bottom:15px}nav button{min-width:145px}main{padding:20px}.row{grid-template-columns:1fr}aside>.toolbar,aside>progress,aside>.hint{display:none}}@media print{header small,aside,.footer,.toolbar,main>p,main>h2{display:none}.layout{display:block}main{border:0;padding:0}body{background:white}#preview{font-size:12px}}
</style><header><a href="/review.html" style="color:#245846;font-size:14px">← 返回文獻共同入口</a><br><small>RESEARCH NOTEBOOK</small><h1>學生文獻整理</h1><p style="margin:0">依序記錄研究資訊，讓每篇文獻都有清楚的脈絡。</p></header><section id="identity" style="max-width:1100px;margin:20px auto;padding:0 24px"><div class="card"><h2>開始整理文獻</h2><p>填寫學號與姓名後，草稿會儲存至課程網站，供教師查看進度。每份紀錄整理一篇文章。</p><div class="row"><div><label for="studentId">學號</label><input id="studentId" maxlength="40" autocomplete="username"></div><div><label for="studentName">姓名</label><input id="studentName" maxlength="60" autocomplete="name"></div></div><button id="start" class="primary" style="margin-top:20px">開始／登記目前草稿</button><p id="loginStatus" role="status"></p><a href="/literature-teacher.html">教師監考頁面 →</a></div></section><div class="layout"><aside><nav id="nav" aria-label="填寫步驟"></nav><p class="hint">步驟進度</p><progress id="progress" max="8" value="1"></progress><div id="status" role="status" aria-live="polite"></div><p class="hint">登記後草稿會自動儲存至課程網站。請保留目前瀏覽器以續填；也可匯出備份。</p><div class="toolbar"><button id="export">匯出備份</button><button id="import">匯入備份</button><button id="new">新增文獻</button></div><input type="file" id="file" accept="application/json,.json" hidden></aside><main><span class="hint" id="step"></span><h2 id="heading"></h2><p id="description"></p><form id="form"></form><div id="preview" hidden></div><div class="footer"><button id="prev">上一步</button><button class="primary" id="next">下一步 →</button></div></main></div><script src="/word-export.js"></script><script src="/excel-export.js"></script><script>
const names=['文章名稱','作者姓名與年代','研究目的','研究設計','研究對象','研究變項','研究結果','檢視與匯出'];
const hints=['輸入文章完整題名。','記錄作者姓名與文章發表年份。','說明研究問題、目的或假設。','記錄研究設計與研究方法。','整理個案數、收案條件與排除條件。','每個變項各填一筆，記錄工具及其信效度。','依單變項、雙變項與其他分析逐筆記錄。','確認內容後匯出文字，或列印／另存為 PDF。'];
const sessionKey='literature-course-session-v1';let session=null;let syncTimer=null,dirty=false,inFlight=null,blocked=false;try{session=JSON.parse(localStorage.getItem(sessionKey))}catch{}const key='literature-form-v1';const blank=()=>({title:'',authors:'',year:'',purpose:'',design:'',population:'',setting:'',sample:'',inclusion:'',exclusion:'',variables:[{name:'',tool:'',reliability:'',validity:''}],results:[{type:'單變項',variables:'',method:'',findings:''}]});let data=blank(),step=0;try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&valid(saved))data=saved}catch(e){}function valid(x){return x&&typeof x==='object'&&['title','authors','year','purpose','design','population','setting','sample','inclusion','exclusion'].every(k=>typeof x[k]==='string')&&Array.isArray(x.variables)&&x.variables.every(v=>v&&['name','tool','reliability','validity'].every(k=>typeof v[k]==='string'))&&Array.isArray(x.results)&&x.results.every(v=>v&&['type','variables','method','findings'].every(k=>typeof v[k]==='string'))}
const el=id=>document.getElementById(id);function save(){scheduleSync();try{localStorage.setItem(key,JSON.stringify(data));el('status').textContent='已自動儲存 · '+new Date().toLocaleTimeString('zh-TW')}catch(e){el('status').textContent='無法自動儲存，請匯出備份。'}}
function field(parent,label,key,obj=data,area=true,placeholder=''){const l=document.createElement('label'),input=document.createElement(area?'textarea':'input');input.id='f'+document.querySelectorAll('input,textarea,select').length;l.htmlFor=input.id;l.textContent=label;input.value=obj[key];input.placeholder=placeholder;input.oninput=()=>{obj[key]=input.value;save()};parent.append(l,input)}
function render(){el('nav').replaceChildren();names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+'  '+n;b.className=i===step?'active':'';if(i===step)b.setAttribute('aria-current','step');b.onclick=()=>{step=i;render()};el('nav').append(b)});el('step').textContent='STEP '+String(step+1).padStart(2,'0')+' / 08';el('progress').value=step+1;el('heading').textContent=names[step];el('description').textContent=hints[step];const f=el('form');f.replaceChildren();el('preview').hidden=step!==7;el('prev').disabled=step===0;el('next').hidden=step===7;
if(step===0)field(f,'文章名稱','title',data,true,'請輸入完整題名');if(step===1){field(f,'作者姓名','authors');field(f,'發表年代／年份','year',data,false,'例如：2024')}if(step===2)field(f,'研究目的','purpose');if(step===3)field(f,'研究設計','design',data,true,'例如：橫斷式研究、隨機對照試驗、質性研究');if(step===4){field(f,'研究對象特性','population');field(f,'研究場域','setting',data,false);field(f,'個案數','sample',data,false,'可分別記錄收案人數、各組人數與完成分析人數');field(f,'收案條件','inclusion');field(f,'排除條件','exclusion')}
if(step===5||step===6){const list=step===5?data.variables:data.results;list.forEach((obj,i)=>{const card=document.createElement('section');card.className='card';const h=document.createElement('h3');h.textContent=(step===5?'變項':'結果')+' '+(i+1);const del=document.createElement('button');del.type='button';del.textContent='移除';del.onclick=()=>{if(confirm('確定移除此筆資料？')){list.splice(i,1);save();render()}};h.append(del);card.append(h);if(step===5){field(card,'變項名稱（可註記角色）','name',obj,false);field(card,'使用的研究工具','tool',obj,true,'工具名稱、版本、計分與測量時間');field(card,'信度','reliability',obj,true,'註明原始工具或本篇研究，例如 Cronbach’s α');field(card,'效度','validity',obj,true,'註明效度類型、證據與數值')}else{const label=document.createElement('label');label.textContent='結果類別';label.htmlFor='type'+i;const sel=document.createElement('select');sel.id='type'+i;['單變項','雙變項','其他'].forEach(v=>{const o=new Option(v,v);sel.add(o)});sel.value=obj.type;sel.onchange=()=>{obj.type=sel.value;save()};card.append(label,sel);field(card,'變項／變項之間的關係','variables',obj,false);field(card,'統計或分析方法','method',obj,false);field(card,'結果數值與說明','findings',obj,true,'單變項：人數、百分比、平均值、標準差；雙變項：差異或相關；其他：多變項、中介、調節或質性結果。請記錄係數、p 值與信賴區間（如有）。')}f.append(card)});const add=document.createElement('button');add.type='button';add.textContent=step===5?'＋ 新增研究變項':'＋ 新增研究結果';add.onclick=()=>{list.push(step===5?{name:'',tool:'',reliability:'',validity:''}:{type:'單變項',variables:'',method:'',findings:''});save();render()};f.append(add);const note=document.createElement('p');note.className='hint';note.textContent='未提供的資訊請填「未報告」；不適用請填「不適用」。';f.append(note)}
if(step===7){el('preview').textContent=summary();const bar=document.createElement('div');bar.className='toolbar';[['繳交文獻整理',submitReview],['匯出 Word 答案',exportWord],['匯出 Excel 答案',exportExcel],['匯出文字',()=>download(summary(),'txt','text/plain;charset=utf-8')],['列印／另存 PDF',()=>window.print()]].forEach(([t,fn])=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=fn;bar.append(b)});f.append(bar)}if(session?.submitted){f.querySelectorAll('input,textarea,select,button').forEach(x=>x.disabled=true);if(step===7)f.querySelectorAll('button').forEach(x=>{if(x.textContent!=='繳交文獻整理')x.disabled=false})}if(session)el('identity').hidden=true;}
function exportWord(){try{exportWordAnswers({title:'一般文獻整理答案',articleTitle:data.title,data,kind:'general',studentId:session?.studentId||el('studentId').value,studentName:session?.studentName||el('studentName').value,submitted:!!session?.submitted})}catch(e){alert('Word 匯出失敗，請重試：'+e.message)}}
function exportExcel(){try{exportExcelAnswers({title:'一般文獻整理答案',articleTitle:data.title,data,kind:'general',studentId:session?.studentId||el('studentId').value,studentName:session?.studentName||el('studentName').value,submitted:!!session?.submitted})}catch(e){alert('Excel 匯出失敗，請重試：'+e.message)}}
function summary(){const v=x=>x||'（尚未填寫）';return `一、文章名稱\n${v(data.title)}\n\n二、作者姓名與年代\n作者：${v(data.authors)}\n年代：${v(data.year)}\n\n三、研究目的\n${v(data.purpose)}\n\n四、研究設計\n${v(data.design)}\n\n五、研究對象\n對象特性：${v(data.population)}\n場域：${v(data.setting)}\n個案數：${v(data.sample)}\n收案條件：${v(data.inclusion)}\n排除條件：${v(data.exclusion)}\n\n六、研究變項\n${data.variables.map((x,i)=>`${i+1}. ${v(x.name)}\n研究工具：${v(x.tool)}\n信度：${v(x.reliability)}\n效度：${v(x.validity)}`).join('\n\n')}\n\n七、研究結果\n${['單變項','雙變項','其他'].map(t=>t+'\n'+(data.results.filter(x=>x.type===t).map((x,i)=>`${i+1}. 變項／關係：${v(x.variables)}\n分析方法：${v(x.method)}\n結果：${v(x.findings)}`).join('\n\n')||'（尚未填寫）')).join('\n\n')}`}
function download(content,ext,mime){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type:mime}));a.href=url;a.download=(data.title||'文獻整理').replace(/[\\/:*?"<>|]/g,'_').slice(0,80)+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}el('prev').onclick=()=>{step--;render()};el('next').onclick=()=>{step++;render();window.scrollTo(0,0)};el('export').onclick=()=>download(JSON.stringify(data,null,2),'json','application/json');el('import').onclick=()=>{if(session?.submitted){alert('此紀錄已繳交。請新增文獻後再匯入。');return}el('file').click()};el('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!valid(x))throw Error();if(confirm('匯入將取代目前表單，請先備份。確定匯入？')){data=x;step=0;save();render()}}catch(e){alert('檔案格式不符，請選擇由此介面匯出的 JSON 備份。')}el('file').value=''};el('new').onclick=()=>{if(confirm('新增文獻將清空目前表單，請先匯出備份。確定繼續？')){session=null;sessionStorage.removeItem(sessionKey);localStorage.removeItem(sessionKey);el('identity').hidden=false;data=blank();step=0;save();render()}};el('form').onsubmit=e=>e.preventDefault();
function remember(){localStorage.setItem(sessionKey,JSON.stringify(session))}
async function request(body){const res=await fetch('/api/literature',{method:'POST',headers:{'content-type':'application/json',...(session?{authorization:'Bearer '+session.token}:{})},body:JSON.stringify(body)});const x=await res.json();if(!res.ok){const error=new Error(x.error||'無法連線');error.status=res.status;throw error}return x}
function scheduleSync(){if(!session||session.submitted||blocked)return;dirty=true;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync().catch(()=>{}),800)}
async function sync(){if(inFlight)return inFlight;if(!session||session.submitted||blocked)return;inFlight=(async()=>{while(dirty){dirty=false;const current=session;const payload=JSON.parse(JSON.stringify(data));try{const x=await request({action:'save',id:current.id,revision:current.revision,step,data:payload});if(session!==current)return;session.revision=x.revision;remember();el('status').textContent='已儲存至課程網站 · '+new Date().toLocaleTimeString('zh-TW')}catch(e){dirty=true;if(e.status===409||e.status===401)blocked=true;el('status').textContent='雲端儲存失敗：'+e.message+'（本機草稿已保留）';throw e}}})().finally(()=>{inFlight=null});return inFlight}
async function submitReview(){if(!session){alert('請先在頁面上方填写學號與姓名，登記整理紀錄。');return}if(session.submitted)return;if(!confirm('確定繳交？繳交後此篇文獻將鎖定，教師可查看完整內容。'))return;try{dirty=true;await sync();if(blocked)throw Error('請重新整理以確認最新版本。');const x=await request({action:'submit',id:session.id,revision:session.revision,step,data});session.revision=x.revision;session.submitted=true;remember();render();el('status').textContent='已成功繳交 · '+new Date(x.updatedAt).toLocaleString('zh-TW')}catch(e){alert(e.message)}}
el('start').onclick=async()=>{const button=el('start');button.disabled=true;try{const x=await request({action:'start',studentId:el('studentId').value,studentName:el('studentName').value,data});session=x;blocked=false;remember();render();el('status').textContent='已登記：'+x.studentId+' '+x.studentName;el('identity').hidden=true}catch(e){el('loginStatus').textContent=e.message}finally{button.disabled=false}};
const oldRender=render;render=function(){oldRender();if(session){el('heading').textContent=names[step]+' · '+session.studentName;el('identity').hidden=true;if(session.submitted)el('status').textContent='此份文獻已繳交，內容已鎖定。'}if(session&&!session.submitted)scheduleSync()};
async function initialize(){if(session){el('status').textContent='正在載入課程紀錄…';try{const res=await fetch('/api/literature?id='+encodeURIComponent(session.id),{headers:{authorization:'Bearer '+session.token},cache:'no-store'});const x=await res.json();if(!res.ok)throw Error(x.error);if(valid(x.review.data)){const local=data;data=x.review.data;step=x.review.step;session.revision=x.review.revision;session.submitted=x.review.status==='submitted';remember();if(!session.submitted&&JSON.stringify(local)!==JSON.stringify(data)&&confirm('本機草稿與課程網站不同。要保留本機草稿並更新網站嗎？'))data=local;localStorage.setItem(key,JSON.stringify(data))}render()}catch(e){blocked=true;render();el('status').textContent='載入失敗：'+e.message+'。請重新整理；可匯出本機草稿。'}}else{render();el('status').textContent='尚未登記：目前僅儲存本機草稿。'}}
setInterval(()=>{if(session&&!blocked){request({action:'heartbeat',id:session.id}).catch(()=>{});if(dirty)sync().catch(()=>{})}},15000);window.addEventListener('beforeunload',e=>{if(dirty||inFlight){e.preventDefault();e.returnValue=''}});initialize();
</script></html>
