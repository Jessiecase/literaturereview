<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系統性文獻・學生整理</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#233d3b;background:#f4f5ef}*{box-sizing:border-box}body{margin:0}header{padding:24px 5%;border-bottom:1px solid #dce2d8;background:#fff}header small{letter-spacing:3px;color:#637b71}h1{font-size:26px;margin:8px 0}p{color:#667c72;line-height:1.7}.layout{display:grid;grid-template-columns:235px 1fr;max-width:1150px;margin:30px auto;gap:32px;padding:0 24px}nav button{display:block;width:100%;text-align:left;margin:7px 0;background:transparent;color:#526b61;border:0;padding:14px;border-radius:10px}button{cursor:pointer;font:inherit;padding:10px 17px;border:1px solid #ccd8cf;border-radius:8px;background:#fff;color:#294f43}button.active,button.primary{background:#245846;color:white;border-color:#245846}main{background:white;padding:30px;border:1px solid #dfe5db;border-radius:16px;min-width:0}h2{margin-top:8px;font-size:24px}label{display:block;margin:19px 0 7px;font-weight:600;font-size:14px}input,textarea,select{font:inherit;width:100%;padding:12px;border:1px solid #cad5ce;border-radius:8px;background:#fdfefa;color:#233d3b}input:focus,textarea:focus,select:focus{outline:2px solid #6c9e87;outline-offset:2px}textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#f7f9f4;border:1px solid #dce5d9;padding:20px;border-radius:12px;margin:18px 0}.card h3{margin:0;display:flex;justify-content:space-between;align-items:center}.card h3 button{font-size:13px}.footer{display:flex;justify-content:space-between;margin-top:30px;padding-top:20px;border-top:1px solid #e4e9df}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}progress{width:100%;accent-color:#245846;height:7px}#status{font-size:12px;margin:15px 0;color:#617b6b}.hint{font-size:13px;color:#6e8075}#preview{white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere} @media(max-width:750px){.layout{display:block;padding:0 14px;margin:16px auto}nav{display:flex;overflow:auto;margin-bottom:15px}nav button{min-width:145px}main{padding:20px}.row{grid-template-columns:1fr}aside>progress,aside>.hint{display:none}}@media print{#identity{display:none}header small,aside,.footer,.toolbar,main>p,main>h2{display:none}.layout{display:block}main{border:0;padding:0}body{background:white}#preview{font-size:12px}}
</style><header><a href="/review.html" style="color:#245846;font-size:14px">← 返回文獻共同入口</a><br><small>RESEARCH NOTEBOOK</small><h1>系統性文獻・學生整理</h1><p style="margin:0">系統性回顧與統合分析 · 九項整理 · 雲端同步</p></header><section id="identity" style="max-width:1100px;margin:20px auto;padding:0 24px"><div class="card"><h2>開始系統性文獻整理</h2><p>填寫學號與姓名後，草稿會儲存至課程網站，供教師查看進度。每份紀錄整理一篇文章。</p><div class="row"><div><label for="studentId">學號</label><input id="studentId" maxlength="40" autocomplete="username"></div><div><label for="studentName">姓名</label><input id="studentName" maxlength="60" autocomplete="name"></div></div><button id="start" class="primary" style="margin-top:20px">開始／登記目前草稿</button><p id="loginStatus" role="status"></p><a href="/literature-teacher.html">教師監考頁面 →</a></div></section><div class="layout"><aside><nav id="nav" aria-label="填寫步驟"></nav><p class="hint">步驟進度</p><progress id="progress" max="8" value="1"></progress><div id="status" role="status" aria-live="polite"></div><p class="hint">登記後草稿會自動儲存至課程網站。請保留目前瀏覽器以續填；也可匯出備份。</p><div class="toolbar"><button id="export">匯出備份</button><button id="import">匯入備份</button><button id="new">新增文獻</button></div><input type="file" id="file" accept="application/json,.json" hidden></aside><main><span class="hint" id="step"></span><h2 id="heading"></h2><p id="description"></p><form id="form"></form><div id="preview" hidden></div><div class="footer"><button id="prev">上一步</button><button class="primary" id="next">下一步 →</button></div></main></div><script src="/systematic-schema.js"></script><script src="/word-export.js"></script><script src="/excel-export.js"></script><script>
const names=reviewSections.map(s=>s[0]).concat('檢視與繳交');
const hints=names.map(()=> '依文章內容填寫；未提供請填「未報告」，不適用請填「不適用」。各分析結果請逐一記錄。');
const sessionKey='systematic-session-v1';let session=null;let syncTimer=null,dirty=false,inFlight=null,blocked=false;try{session=JSON.parse(localStorage.getItem(sessionKey))}catch{}const key='systematic-form-v1';const blank=blankReview;let data=blank(),step=0;try{const saved=JSON.parse(localStorage.getItem(key));if(validReview(saved))data=saved}catch{}const valid=validReview;
const el=id=>document.getElementById(id);function save(){scheduleSync();try{localStorage.setItem(key,JSON.stringify(data));el('status').textContent=(session?'本機已儲存，等待雲端同步 · ':'尚未登記，僅本機已儲存 · ')+new Date().toLocaleTimeString('zh-TW')}catch(e){el('status').textContent='無法自動儲存，請匯出備份。'}}
function field(parent,label,key,obj=data,area=true,placeholder=''){const l=document.createElement('label'),input=document.createElement(area?'textarea':'input');input.id='f'+document.querySelectorAll('input,textarea,select').length;l.htmlFor=input.id;l.textContent=label;input.value=obj[key];input.placeholder=placeholder;input.oninput=()=>{obj[key]=input.value;save()};parent.append(l,input)}
function render(){
el('nav').replaceChildren();names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+' '+n+(i<9&&sectionDone(data,reviewSections[i])?' ✓':'');b.className=i===step?'active':'';b.onclick=()=>{step=i;render()};if(i===step)b.setAttribute('aria-current','step');el('nav').append(b)});
el('step').textContent='STEP '+(step+1)+' / 10';el('progress').max=9;el('progress').value=reviewSections.filter(s=>sectionDone(data,s)).length;el('heading').textContent=names[step];el('description').textContent=hints[step];
const f=el('form');f.replaceChildren();el('preview').hidden=step!==9;el('prev').disabled=step===0;el('next').hidden=step===9;
if(step<9){reviewSections[step][1].forEach(x=>field(f,x[1],x[0]));if(session?.submitted)f.querySelectorAll('input,textarea').forEach(x=>x.disabled=true)}
else{el('preview').textContent=summary();const bar=document.createElement('div');bar.className='toolbar';[['繳交文獻整理',submitReview],['匯出 Word 答案',exportWord],['匯出 Excel 答案',exportExcel],['匯出文字',()=>download(summary(),'txt','text/plain;charset=utf-8')],['列印／另存 PDF',()=>window.print()]].forEach(([t,fn])=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=fn;if(t==='繳交文獻整理')b.disabled=!!session?.submitted;bar.append(b)});f.append(bar);const note=document.createElement('p');note.textContent='完成 '+reviewSections.filter(s=>sectionDone(data,s)).length+' / 9 項。繳交後鎖定內容，請先核對。';f.append(note)}
if(session)el('identity').hidden=true;
}
function exportWord(){try{exportWordAnswers({title:'系統性文獻整理答案',articleTitle:data.title,data,kind:'systematic',sections:reviewSections,studentId:session?.studentId||el('studentId').value,studentName:session?.studentName||el('studentName').value,submitted:!!session?.submitted})}catch(e){alert('Word 匯出失敗，請重試：'+e.message)}}
function exportExcel(){try{exportExcelAnswers({title:'系統性文獻整理答案',articleTitle:data.title,data,kind:'systematic',sections:reviewSections,studentId:session?.studentId||el('studentId').value,studentName:session?.studentName||el('studentName').value,submitted:!!session?.submitted})}catch(e){alert('Excel 匯出失敗，請重試：'+e.message)}}
function summary(){return reviewSummary(data)}
function download(content,ext,mime){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type:mime}));a.href=url;a.download=(data.title||'文獻整理').replace(/[\\/:*?"<>|]/g,'_').slice(0,80)+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}el('prev').onclick=()=>{step--;render()};el('next').onclick=()=>{step++;render();window.scrollTo(0,0)};el('export').onclick=()=>download(JSON.stringify(data,null,2),'json','application/json');el('import').onclick=()=>{if(session?.submitted){alert('此紀錄已繳交。請新增文獻後再匯入。');return}el('file').click()};el('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!valid(x))throw Error();if(confirm('匯入將取代目前表單，請先備份。確定匯入？')){data=x;step=0;save();render()}}catch(e){alert('檔案格式不符，請選擇由此介面匯出的 JSON 備份。')}el('file').value=''};el('new').onclick=()=>{if(confirm('新增文獻將清空目前表單，請先匯出備份。確定繼續？')){if(inFlight){alert('正在儲存，請稍後再新增。');return}session=null;blocked=false;dirty=false;clearTimeout(syncTimer);sessionStorage.removeItem(sessionKey);localStorage.removeItem(sessionKey);el('identity').hidden=false;data=blank();step=0;save();render()}};el('form').onsubmit=e=>e.preventDefault();
function remember(){localStorage.setItem(sessionKey,JSON.stringify(session))}
async function request(body){const res=await fetch('/api/systematic',{method:'POST',headers:{'content-type':'application/json',...(session?{authorization:'Bearer '+session.token}:{})},body:JSON.stringify(body)});const x=await res.json();if(!res.ok){const error=new Error(x.error||'無法連線');error.status=res.status;throw error}return x}
function scheduleSync(){if(!session||session.submitted||blocked)return;dirty=true;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync().catch(()=>{}),800)}
async function sync(){if(inFlight)return inFlight;if(!session||session.submitted||blocked)return;inFlight=(async()=>{while(dirty){dirty=false;const current=session;const payload=JSON.parse(JSON.stringify(data));try{const x=await request({action:'save',id:current.id,revision:current.revision,step,data:payload});if(session!==current)return;session.revision=x.revision;remember();el('status').textContent='已儲存至課程網站 · '+new Date().toLocaleTimeString('zh-TW')}catch(e){dirty=true;if(e.status===409||e.status===401)blocked=true;el('status').textContent='雲端儲存失敗：'+e.message+'（本機草稿已保留）';throw e}}})().finally(()=>{inFlight=null});return inFlight}
async function submitReview(){if(!session){alert('請先在頁面上方填写學號與姓名，登記整理紀錄。');return}if(session.submitted)return;if(!confirm('確定繳交？繳交後此篇文獻將鎖定，教師可查看完整內容。'))return;try{dirty=true;await sync();if(blocked)throw Error('請重新整理以確認最新版本。');const x=await request({action:'submit',id:session.id,revision:session.revision,step,data});session.revision=x.revision;session.submitted=true;remember();render();el('status').textContent='已成功繳交 · '+new Date(x.updatedAt).toLocaleString('zh-TW')}catch(e){alert(e.message)}}
el('start').onclick=async()=>{const button=el('start');button.disabled=true;try{const x=await request({action:'start',studentId:el('studentId').value,studentName:el('studentName').value,data});session=x;blocked=false;remember();render();el('status').textContent='已登記：'+x.studentId+' '+x.studentName;el('identity').hidden=true}catch(e){el('loginStatus').textContent=e.message}finally{button.disabled=false}};
const oldRender=render;render=function(){oldRender();if(session){el('heading').textContent=names[step]+' · '+session.studentName;el('identity').hidden=true;if(session.submitted)el('status').textContent='此份文獻已繳交，內容已鎖定。'}if(session&&!session.submitted)scheduleSync()};
async function initialize(){if(session){el('status').textContent='正在載入課程紀錄…';try{const res=await fetch('/api/systematic?id='+encodeURIComponent(session.id),{headers:{authorization:'Bearer '+session.token},cache:'no-store'});const x=await res.json();if(!res.ok)throw Error(x.error);if(valid(x.review.data)){const local=data;data=x.review.data;step=x.review.step;session.revision=x.review.revision;session.submitted=x.review.status==='submitted';remember();if(!session.submitted&&JSON.stringify(local)!==JSON.stringify(data)&&confirm('本機草稿與課程網站不同。要保留本機草稿並更新網站嗎？'))data=local;localStorage.setItem(key,JSON.stringify(data))}render()}catch(e){blocked=true;render();el('status').textContent='載入失敗：'+e.message+'。請重新整理；可匯出本機草稿。'}}else{render();el('status').textContent='尚未登記：目前僅儲存本機草稿。'}}
setInterval(()=>{if(session&&!blocked){request({action:'heartbeat',id:session.id}).catch(()=>{});if(dirty)sync().catch(()=>{})}},15000);window.addEventListener('beforeunload',e=>{if(dirty||inFlight){e.preventDefault();e.returnValue=''}});initialize();
</script></html>
