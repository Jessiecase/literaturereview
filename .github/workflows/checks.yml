name: Verify student answer exports
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Word and Excel exports
        run: node tests/export-smoke.mjs
      - name: Verify browser scripts
        run: |
          node --check public/word-export.js
          node --check public/excel-export.js
          node --check public/systematic-schema.js
